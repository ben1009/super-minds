name: Headless Browser Tests

on:
  push:
    branches: [ master, main, 'refactor/**' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Headless Browser Testing with Playwright
  # ============================================
  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: |
        npm init -y
        npm install @playwright/test
        npx playwright install chromium
        
    - name: Run Playwright tests
      run: |
        cat > playwright.config.js << 'CONFIG'
        module.exports = {
          testDir: './tests',
          use: {
            headless: true,
            browserName: 'chromium',
            screenshot: 'only-on-failure',
            video: 'retain-on-failure',
          },
        };
        CONFIG
        
        mkdir -p tests
        
        cat > tests/e2e.spec.js << 'TEST'
        const { test, expect } = require('@playwright/test');
        const http = require('http');
        const fs = require('fs');
        const path = require('path');
        
        // Start static server before tests
        let server;
        
        test.beforeAll(async () => {
          server = http.createServer((req, res) => {
            let filePath = '.' + req.url;
            if (filePath === './') filePath = './index.html';
            
            const extname = String(path.extname(filePath)).toLowerCase();
            const mimeTypes = {
              '.html': 'text/html',
              '.js': 'text/javascript',
              '.css': 'text/css',
            };
            
            const contentType = mimeTypes[extname] || 'application/octet-stream';
            
            fs.readFile(filePath, (error, content) => {
              if (error) {
                res.writeHead(404);
                res.end('Not Found');
              } else {
                res.writeHead(200, { 'Content-Type': contentType });
                res.end(content, 'utf-8');
              }
            });
          });
          
          await new Promise((resolve) => server.listen(8000, resolve));
          console.log('Test server started on port 8000');
        });
        
        test.afterAll(async () => {
          if (server) {
            await new Promise((resolve) => server.close(resolve));
          }
        });
        
        // ============================================
        // Homepage Tests
        // ============================================
        test.describe('Homepage', () => {
          test('homepage loads with correct title', async ({ page }) => {
            await page.goto('http://localhost:8000/');
            await expect(page).toHaveTitle(/Super Minds/);
          });
          
          test('homepage has navigation links', async ({ page }) => {
            await page.goto('http://localhost:8000/');
            const unit7Link = page.locator('a[href="sm2/unit7/present-continuous-course.html"]').first();
            await expect(unit7Link).toBeVisible();
          });
          
          test('shared CSS is loaded', async ({ page }) => {
            await page.goto('http://localhost:8000/');
            const cssLink = page.locator('link[href*="common.css"]');
            await expect(cssLink).toHaveAttribute('rel', 'stylesheet');
          });
          
          test('page has gradient background', async ({ page }) => {
            await page.goto('http://localhost:8000/');
            const body = page.locator('body');
            const hasGradient = await body.evaluate(el => {
              const style = window.getComputedStyle(el);
              return style.background.includes('gradient') || 
                     style.backgroundImage.includes('gradient');
            });
            expect(hasGradient).toBeTruthy();
          });
        });
        
        // ============================================
        // Unit 7 Tests
        // ============================================
        test.describe('Unit 7', () => {
          test('Unit 7 page loads', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit7/present-continuous-course.html');
            await expect(page).toHaveTitle(/Unit 7|现在进行时/);
          });
          
          test('shared JavaScript is loaded', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit7/present-continuous-course.html');
            const hasToggle = await page.evaluate(() => typeof toggleMobileMenu === 'function');
            expect(hasToggle).toBeTruthy();
          });
          
          test('quiz items are clickable', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit7/present-continuous-course.html');
            const quizItem = page.locator('.quiz-item').first();
            await expect(quizItem).toBeVisible();
            await quizItem.click();
            const answer = quizItem.locator('.quiz-answer');
            await expect(answer).toHaveClass(/show/);
          });
          
          test('mobile menu button exists', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit7/present-continuous-course.html');
            // Set mobile viewport
            await page.setViewportSize({ width: 375, height: 667 });
            const menuButton = page.locator('button[onclick="toggleMobileMenu()"], button[aria-label*="navigation"]').first();
            await expect(menuButton).toBeVisible();
          });
        });
        
        // ============================================
        // Homework Page Tests
        // ============================================
        test.describe('Homework Page', () => {
          test('homework page loads', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit7/present-continuous-homework.html');
            await expect(page).toHaveTitle(/Homework|作业/);
          });
          
          test('progress tracking functions exist', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit7/present-continuous-homework.html');
            const hasUpdateProgress = await page.evaluate(() => typeof updateProgress === 'function');
            const hasToggleComplete = await page.evaluate(() => typeof toggleComplete === 'function');
            expect(hasUpdateProgress).toBeTruthy();
            expect(hasToggleComplete).toBeTruthy();
          });
          
          test('checkboxes are interactive', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit7/present-continuous-homework.html');
            const checkbox = page.locator('input[type="checkbox"]').first();
            await expect(checkbox).toBeVisible();
            await checkbox.check();
            await expect(checkbox).toBeChecked();
          });
          
          test('answer masks toggle on click', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit7/present-continuous-homework.html');
            // Use JavaScript click to bypass visibility checks
            await page.evaluate(() => {
              const mask = document.querySelector('.answer-mask');
              if (mask) mask.click();
            });
            const answerMask = page.locator('.answer-mask').first();
            await expect(answerMask).toHaveClass(/revealed/);
          });
          
          test('flashcards flip on click', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit7/present-continuous-homework.html');
            const flashcard = page.locator('.flashcard').first();
            await expect(flashcard).toBeVisible();
            await flashcard.click();
            await expect(flashcard).toHaveClass(/flipped/);
          });
        });
        
        // ============================================
        // Cross-page Navigation Tests
        // ============================================
        test.describe('Navigation', () => {
          test('can navigate from home to Unit 7', async ({ page }) => {
            await page.goto('http://localhost:8000/');
            await page.click('a[href="sm2/unit7/present-continuous-course.html"]');
            await expect(page).toHaveURL(/unit7\/present-continuous-course\.html/);
          });
          
          test('can navigate from Unit 7 to Homework', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit7/present-continuous-course.html');
            // Hover over Unit 7 to open dropdown, then click homework
            await page.locator('a:has-text("Unit 7"), .group:has-text("Unit 7")').first().hover();
            await page.waitForTimeout(100); // Wait for dropdown to appear
            await page.click('a[href="present-continuous-homework.html"]');
            await expect(page).toHaveURL(/present-continuous-homework\.html/);
          });
          
          test('navigation links work in mobile menu', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit7/present-continuous-course.html');
            await page.setViewportSize({ width: 375, height: 667 });
            
            // Open mobile menu
            await page.locator('button[onclick="toggleMobileMenu()"], button[aria-label*="navigation"]').first().click();
            
            // Click a link in mobile menu
            await page.click('#mobileMenu a[href="../../index.html"]');
            const url = page.url();
            expect(url).toMatch(/http:\/\/localhost:8000\/(index\.html)?$/);
          });
          
          test('can navigate from Unit 8 Sports to Amazing Vehicles', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit8/gerunds-ball-sports.html');
            // Hover over SM2 mega-dropdown to open it, then click Amazing Vehicles
            await page.locator('a:has-text("SM2")').first().hover();
            await page.waitForTimeout(300); // Wait for mega-dropdown to appear
            await page.click('a[href="amazing-vehicles-reading.html"]');
            await expect(page).toHaveURL(/amazing-vehicles-reading\.html/);
          });
          
          test('Amazing Vehicles page loads', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit8/amazing-vehicles-reading.html');
            await expect(page).toHaveTitle(/Amazing Vehicles|交通工具/);
          });
          
          test('Unit 8 Reading page loads', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit8/fun-things-we-do-reading.html');
            await expect(page).toHaveTitle(/Fun Things We Do|补充阅读/);
          });
          
          test('Unit 8 Grammar page loads', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit8/question-words-grammar-homework.html');
            await expect(page).toHaveTitle(/Homework|作业练习/);
          });
          
          test('Unit 8 fill-blank toggle works', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit8/gerunds-ball-sports.html');
            
            // Find first fill-blank element
            const blank = page.locator('.fill-blank').first();
            await expect(blank).toBeVisible();
            
            // Get initial text
            const beforeText = await blank.textContent();
            
            // Click to reveal answer
            await blank.click();
            await page.waitForTimeout(300);
            
            // Get text after click
            const afterText = await blank.textContent();
            
            // Should have changed from placeholder to answer
            expect(beforeText).toBe('_____');
            expect(afterText).not.toBe('_____');
            expect(afterText).toBeTruthy();
          });
          
          test('Unit 9 page loads', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/unit9/holiday-plans-grammar-review.html');
            await expect(page).toHaveTitle(/Unit 9|假期计划语法/);
          });
          
          test('can navigate from Baseball homepage to Unit 9', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/baseball/index.html');
            await page.waitForSelector('a[href="../unit9/holiday-plans-grammar-review.html"]');
            await page.locator('a[href="../unit9/holiday-plans-grammar-review.html"]').first().click();
            await expect(page).toHaveURL(/unit9\/holiday-plans-grammar-review\.html/);
          });
          
          test('can navigate from Baseball Unit 7 to Unit 9', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/baseball/unit7/baseball-present-continuous-course.html');
            await page.waitForSelector('a[href="../../unit9/holiday-plans-grammar-review.html"]');
            await page.locator('a[href="../../unit9/holiday-plans-grammar-review.html"]').first().click();
            await expect(page).toHaveURL(/unit9\/holiday-plans-grammar-review\.html/);
          });
          
          test('can navigate from Baseball Unit 8 to Unit 9', async ({ page }) => {
            await page.goto('http://localhost:8000/sm2/baseball/unit8/baseball-gerunds-ball-sports.html');
            // Hover over SM2 mega-dropdown to find Unit 9 link
            await page.locator('a:has-text("SM2")').first().hover();
            await page.waitForTimeout(300);
            await page.waitForSelector('a[href="../../unit9/holiday-plans-grammar-review.html"]');
            await page.locator('a[href="../../unit9/holiday-plans-grammar-review.html"]').first().click();
            await expect(page).toHaveURL(/unit9\/holiday-plans-grammar-review\.html/);
          });
        });

        // ============================================
        // SM3 Saving Water Tests
        // ============================================
        test.describe('SM3 Saving Water', () => {
          test('quiz highlights only the latest selection and updates feedback', async ({ page }) => {
            await page.goto('http://localhost:8000/sm3/unit3/saving-water.html');
            const card = page.locator('.reading-card').first();
            const wrong = card.locator('.quiz-option[data-correct="false"]').first();
            const correct = card.locator('.quiz-option[data-correct="true"]').first();
            const nextCard = page.locator('.reading-card').nth(1);
            const nextWrong = nextCard.locator('.quiz-option[data-correct="false"]').first();
            const nextCorrect = nextCard.locator('.quiz-option[data-correct="true"]').first();

            await wrong.click();
            await expect(wrong).toHaveClass(/wrong/);
            await expect(wrong).toHaveAttribute('aria-pressed', 'true');
            await expect(correct).not.toHaveClass(/correct/);
            await expect(card.locator('.quiz-answer-box')).toHaveClass(/show/);
            await expect(card.locator('.quiz-answer-box')).toContainText('Not quite.');

            await correct.click();
            await expect(card).toHaveClass(/revealed/);
            await expect(card.locator('.quiz-option.correct')).toHaveCount(1);
            await expect(wrong).not.toHaveClass(/wrong/);
            await expect(wrong).toHaveAttribute('aria-pressed', 'false');
            await expect(correct).toHaveClass(/correct/);
            await expect(correct).toHaveAttribute('aria-pressed', 'true');
            await expect(card.locator('.quiz-answer-box')).toContainText('Correct!');

            await nextWrong.click();
            await expect(correct).not.toHaveClass(/correct/);
            await expect(correct).toHaveAttribute('aria-pressed', 'false');
            await expect(card.locator('.quiz-answer-box')).not.toHaveClass(/show/);
            await expect(nextWrong).toHaveClass(/wrong/);
            await expect(nextCorrect).not.toHaveClass(/correct/);
            await expect(nextWrong).toHaveAttribute('aria-pressed', 'true');
            await expect(nextCard.locator('.quiz-answer-box')).toContainText('Not quite.');

            await nextWrong.press('Enter');
            await expect(nextCard).not.toHaveClass(/revealed/);
            await expect(nextWrong).not.toHaveClass(/wrong/);
            await expect(nextWrong).toHaveAttribute('aria-pressed', 'false');
            await expect(nextCorrect).not.toHaveClass(/correct/);
            await expect(nextCard.locator('.quiz-answer-box')).not.toHaveClass(/show/);
            await expect(page.locator('section').filter({ has: card }).locator('.quiz-option.correct, .quiz-option.wrong')).toHaveCount(0);
          });

          test('lesson controls expose and update their state', async ({ page }) => {
            await page.goto('http://localhost:8000/sm3/unit3/saving-water.html');

            const blank = page.locator('[data-lesson-action="reveal-answer"]').first();
            await expect(blank).toHaveAttribute('aria-pressed', 'false');
            await blank.press('Enter');
            await expect(blank).toHaveAttribute('aria-pressed', 'true');
            await blank.press('Enter');
            await expect(blank).toHaveAttribute('aria-pressed', 'false');

            const translation = page.locator('[data-lesson-action="toggle-translation"]').first();
            await expect(translation).toHaveAttribute('aria-expanded', 'false');
            await translation.click();
            await expect(translation).toHaveAttribute('aria-expanded', 'true');
            await translation.click();
            await expect(translation).toHaveAttribute('aria-expanded', 'false');

            const todo = page.locator('[data-lesson-action="toggle-todo"]').first();
            await expect(todo).toHaveAttribute('aria-pressed', 'false');
            await todo.click();
            await expect(todo).toHaveAttribute('aria-pressed', 'true');
            const saved = await page.evaluate(() => JSON.parse(localStorage.getItem('sm3Unit3SavingWaterTodos')));
            expect(saved['1']).toBe(true);

            await page.reload();
            await expect(page.locator('[data-lesson-action="toggle-todo"]').first()).toHaveAttribute('aria-pressed', 'true');
            page.once('dialog', dialog => dialog.accept());
            await page.locator('[data-lesson-action="reset-todos"]').click();
            await expect(page.locator('[data-lesson-action="toggle-todo"]').first()).toHaveAttribute('aria-pressed', 'false');

            const cards = page.locator('.reading-card');
            await expect(cards).toHaveCount(4);
            for (let index = 0; index < 4; index++) {
              const quizCard = cards.nth(index);
              const option = quizCard.locator('.quiz-option').first();
              await option.click();
              await expect(quizCard.locator('.quiz-answer-box')).toHaveClass(/show/);
              await expect(page.locator('.quiz-answer-box.show')).toHaveCount(1);
            }
          });

          test('malformed saved todo keys do not stop valid progress restoration', async ({ page }) => {
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            await page.addInitScript(() => {
              localStorage.setItem('sm3Unit3SavingWaterTodos', JSON.stringify({ '"': true, '2': true, '999': true }));
            });
            await page.goto('http://localhost:8000/sm3/unit3/saving-water.html');

            const savedTodo = page.locator('[data-lesson-action="toggle-todo"][data-todo="2"]');
            await expect(savedTodo).toHaveClass(/completed/);
            await expect.poll(() => page.locator('#progressBar').evaluate(element => element.style.width)).toBe('20%');
            expect(pageErrors).toHaveLength(0);
          });
        });

        test('SM3 Daily Routines clears a previous choice in another section', async ({ page }) => {
          await page.goto('http://localhost:8000/sm3/unit3/daily-routines-frequency-adverbs.html');
          const first = page.locator('.reading-card').first();
          const later = page.locator('.reading-card').nth(5);
          await expect(page.locator('.quiz-option[aria-pressed="false"]')).toHaveCount(20);
          await first.locator('.quiz-option[data-correct="true"]').first().click();
          await later.locator('.quiz-option[data-correct="false"]').first().click();
          await expect(page.locator('.quiz-option.correct')).toHaveCount(0);
          await expect(page.locator('.quiz-option.wrong')).toHaveCount(1);
          await expect(page.locator('.quiz-answer-box.show')).toHaveCount(1);
          await expect(first.locator('.quiz-option[aria-pressed="true"]')).toHaveCount(0);
          await expect(later.locator('.quiz-answer-box')).toContainText('Not quite.');
          await later.locator('.quiz-option[data-correct="true"]').first().press('Space');
          await expect(page.locator('.quiz-option.correct')).toHaveCount(1);
          await expect(page.locator('.quiz-option.wrong')).toHaveCount(0);
          await expect(later.locator('.quiz-answer-box')).toContainText('Correct!');
        });
        
        // ============================================
        // Responsive Design Tests
        // ============================================
        test.describe('Responsive Design', () => {
          test('page adapts to mobile viewport', async ({ page }) => {
            await page.goto('http://localhost:8000/');
            await page.setViewportSize({ width: 375, height: 667 });
            
            // Check that content is still visible
            const main = page.locator('main');
            await expect(main).toBeVisible();
            
            // Check that cards are visible on mobile
            const cards = page.locator('a[href="sm2/unit7/present-continuous-course.html"]');
            await expect(cards.first()).toBeVisible();
          });
          
          test('page adapts to desktop viewport', async ({ page }) => {
            await page.goto('http://localhost:8000/');
            await page.setViewportSize({ width: 1280, height: 720 });
            
            // Desktop: grid should show multiple columns
            const grid = page.locator('.grid.md\\:grid-cols-2');
            await expect(grid.first()).toBeVisible();
            
            // Cards should be visible
            const cards = page.locator('a[href="sm2/unit7/present-continuous-course.html"]');
            await expect(cards.first()).toBeVisible();
          });
        });
        TEST
        
        npx playwright test tests/e2e.spec.js --reporter=list
        
    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          test-results/
          playwright-report/
        retention-days: 7
        
    - name: Test Summary
      run: |
        echo "========================================"
        echo "    Headless Browser Tests Complete"
        echo "========================================"

  # ============================================
  # Lighthouse CI for Performance
  # ============================================
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Lighthouse CI
      run: |
        npm install -g @lhci/cli
        
    - name: Run Lighthouse CI
      run: |
        # Create config
        cat > lighthouserc.json << 'CONFIG'
        {
          "ci": {
            "collect": {
              "staticDistDir": ".",
              "url": ["http://localhost:8000/index.html"],
              "startServerCommand": "python3 -m http.server 8000"
            },
            "assert": {
              "preset": "lighthouse:recommended",
              "assertions": {
                "categories:performance": ["warn", {"minScore": 0.8}],
                "categories:accessibility": ["error", {"minScore": 0.9}],
                "categories:best-practices": ["warn", {"minScore": 0.8}]
              }
            }
          }
        }
        CONFIG
        
        # Run Lighthouse (continue on error for initial setup)
        lhci autorun || echo "Lighthouse check completed with warnings"
        
    - name: Upload Lighthouse Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-report
        path: '.lighthouseci/'
        retention-days: 7

  # ============================================
  # Visual Regression Testing
  # ============================================
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Puppeteer
      run: |
        npm install puppeteer pixelmatch pngjs
        
    - name: Capture Screenshots
      run: |
        cat > screenshot-test.js << 'TEST'
        const puppeteer = require('puppeteer');
        const http = require('http');
        const fs = require('fs');
        const path = require('path');
        
        // Start server
        const server = http.createServer((req, res) => {
          let filePath = '.' + req.url;
          if (filePath === './') filePath = './index.html';
          
          fs.readFile(filePath, (error, content) => {
            if (error) {
              res.writeHead(404);
              res.end('Not Found');
            } else {
              res.writeHead(200, { 'Content-Type': 'text/html' });
              res.end(content);
            }
          });
        });
        
        async function captureScreenshots() {
          await new Promise(resolve => server.listen(8000, resolve));
          console.log('Server started');
          
          const browser = await puppeteer.launch({
            headless: 'new',
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });
          
          // Helper function for delay
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
          
          const pages = [
            { url: 'http://localhost:8000/', name: 'homepage' },
            { url: 'http://localhost:8000/sm2/unit7/present-continuous-course.html', name: 'unit7' },
            { url: 'http://localhost:8000/sm2/unit7/present-continuous-homework.html', name: 'homework' },
            { url: 'http://localhost:8000/sm2/unit8/gerunds-ball-sports.html', name: 'unit8-sports' },
            { url: 'http://localhost:8000/sm2/unit8/amazing-vehicles-reading.html', name: 'unit8-vehicles' },
            { url: 'http://localhost:8000/sm2/unit8/fun-things-we-do-reading.html', name: 'unit8-reading' },
            { url: 'http://localhost:8000/sm2/unit8/question-words-grammar-homework.html', name: 'unit8-grammar' },
            { url: 'http://localhost:8000/sm2/unit9/holiday-plans-grammar-review.html', name: 'unit9' },
            { url: 'http://localhost:8000/sm2/baseball/index.html', name: 'baseball-home' },
          ];
          
          // Desktop screenshots
          for (const { url, name } of pages) {
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });
            await page.goto(url, { waitUntil: 'networkidle0' });
            await delay(2000); // Wait for animations
            await page.screenshot({ path: `screenshot-${name}-desktop.png`, fullPage: true });
            console.log(`✅ Screenshot: ${name} (desktop)`);
            await page.close();
          }
          
          // Mobile screenshots
          for (const { url, name } of pages) {
            const page = await browser.newPage();
            await page.setViewport({ width: 375, height: 667 });
            await page.goto(url, { waitUntil: 'networkidle0' });
            await delay(2000); // Wait for animations
            await page.screenshot({ path: `screenshot-${name}-mobile.png`, fullPage: true });
            console.log(`✅ Screenshot: ${name} (mobile)`);
            await page.close();
          }
          
          await browser.close();
          server.close();
          console.log('Screenshots captured successfully');
        }
        
        captureScreenshots().catch(console.error);
